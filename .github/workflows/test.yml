name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: command -v jq || brew install jq
      - name: Run tests
        env:
          BASH_BIN: /bin/bash
        run: /bin/bash test/test.sh
