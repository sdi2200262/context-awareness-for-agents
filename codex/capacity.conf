# Select a model's API maximum, then cap it for your configured Codex window.
# This controls plugin percentages/reminders; it does not configure Codex itself.
selected_model = gpt-6.1-sol
assistant_limit = codex-500k
custom =

# API model maxima (not a guarantee of the window available in Codex):
# https://developers.openai.com/api/docs/models
model.gpt-6.1-sol = 1050000
model.gpt-6-astra = 1050000
model.gpt-6-sol = 1050000
model.gpt-6-luna = 1050000

# Codex usable windows after its 5% reserve: 500,000 * 95% and 272,000 * 95%.
# Observed catalog defaults, not subscription-plan entitlements. The fetched
# catalog currently gives GPT-6.1 Sol 500k, and the other models above 272k.
# https://github.com/openai/codex/blob/main/codex-rs/protocol/src/openai_models.rs
limit.codex-500k = 475000
limit.codex-272k = 258400

# Select codex-272k for a configured 272k window. For another window, add a
# limit preset using its usable token count, or set custom to that count.
# Clear assistant_limit to select the API maximum only when your Codex setup
# actually supports that capacity; API authentication alone does not enable it.
# custom overrides both selections. No model/window/plan is inferred at runtime.
# Clear all three selections to report tokens without a percentage.
